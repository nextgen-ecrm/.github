name: Code to Production Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - Release v*.*.*.*
  push:
    tags:
      - 'v*' #v*.*.*.*

  workflow_dispatch:
    inputs:
      environment:
        description: 'Re-Run Action'
        required: true
        default: 'Re-run Action'
        type: choice
        options:
          - Re-Run Action

jobs:
  label_and_notify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22.2.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3
      - name: Setup Node.js
        uses: actions/setup-node@75716637dc8cd06e88621003df6357fdcee67772 #v3
        with:
          node-version: 22.2.0
  
        if: ${{ ! startsWith(github.ref, 'refs/tags/' || github.ref_name == 'main') }}
       
  build_code: 
     needs: label_and_notify
     uses: ./.github/workflows/build.yml 
  
  create_release:
    runs-on: ubuntu-latest
    needs: build_code
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3 

      - name: Extract PR Description
        id: extract_pr_description
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          PR_DESCRIPTION=$(gh pr view $PR_NUMBER --json body --jq .body)
          echo "PR_DESCRIPTION=$PR_DESCRIPTION" >> $GITHUB_ENV

      - name: Extract Version Number
        id: extract_version_number
        if: github.event_name == 'pull_request'
        run: |
          VERSION_NUMBER=$(echo "${{ env.PR_DESCRIPTION }}" | grep -oP 'Tag: \K[^\s]+')
          echo $VERSION_NUMBER
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV

      - name: Validate Version Number
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! "${{ env.VERSION_NUMBER }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[a-zA-Z]?$ ]]; then
            echo "Invalid version number format. Expected format: vMAJOR.MINOR.PATCH[optional alphabet character]"
            exit 1
          fi    
          
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e #v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          tag_name: ${{ github.event_name == 'pull_request' && env.VERSION_NUMBER || github.ref_name }}
          release_name: Release ${{ github.event_name == 'pull_request' && env.VERSION_NUMBER || github.ref_name }}
          draft: false
          prerelease: false

      - name: Send email notification on release
        uses: dawidd6/action-send-mail@c88d504a7c7e8c41f5fdf5780cc03f45a0039b2c  #v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'CM: ECRM Project Release Ready for Ops Deploy - PROD'
          body: 'A ECRM Project Release is ready for Ops Deployment to PROD environment: ${{ steps.create_release.outputs.html_url }}'
          to: ${{ secrets.EMAIL_USERNAME }}, QA_configmgt@nara.gov
          from: Azure_NextGen_RCPBS@nara.gov
